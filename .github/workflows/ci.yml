name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_fftw_artifact:
        description: Build the separate GPL FFTW portable artifact
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  linux-cuda-tests:
    name: Linux CUDA 12.9 tests
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.9.1-devel-ubuntu24.04
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          apt-get install --yes ca-certificates git
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            gcc-14 g++-14 golang-go libboost-program-options-dev libfftw3-dev \
            libhdf5-dev libtbb-dev libvtk9-dev ninja-build \
            python3-dev python3-pip
          python3 -m pip install --break-system-packages \
            "cmake>=3.30" nanobind numpy "setuptools>=77" wheel
      - name: Configure
        run: |
          CC=gcc-14 CXX=g++-14 cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOVFTOOLKIT_BUILD_DOCS=OFF \
            -DOVFTOOLKIT_BUILD_WOLFRAM_BINDING=OFF \
            -DOVFTOOLKIT_BUILD_PYTHON_BINDING=ON \
            -DOVFTOOLKIT_BUILD_MUMAX_RUNNER=ON \
            -DOVFTOOLKIT_USE_CUFFT=ON \
            -DOVFTOOLKIT_USE_FFTW=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run complete test suite
        run: ctest --test-dir build --output-on-failure

  windows-cuda-portable:
    name: Windows CUDA 12.9 static portable
    runs-on: windows-2022
    env:
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python build and test dependencies
        run: python -m pip install nanobind numpy
      - name: Install CUDA 12.9
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "visual_studio_integration", "cudart", "cufft", "cufft_dev"]'
      - name: Verify CUDA 12.9 installation
        shell: pwsh
        env:
          CUDA_ROOT: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          $required = @(
            "$env:CUDA_ROOT/bin/nvcc.exe",
            "$env:CUDA_ROOT/include/cufft.h",
            "$env:CUDA_ROOT/lib/x64/cufft.lib",
            "$env:CUDA_ROOT/extras/visual_studio_integration/MSBuildExtensions/CUDA 12.9.props"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "CUDA installation is incomplete; missing $path"
            }
          }
          & "$env:CUDA_ROOT/bin/nvcc.exe" --version
      - name: Identify vcpkg tool revision
        id: vcpkg
        shell: pwsh
        run: |
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse --short=12 HEAD
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore release-only vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: windows-vcpkg-x64-static-release-cuda-v1-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}
          restore-keys: |
            windows-vcpkg-x64-static-release-cuda-v1-${{ steps.vcpkg.outputs.revision }}-
      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_BINARY_CACHE
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_BINARY_CACHE,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure CUDA-only static build
        shell: pwsh
        env:
          CUDA_ROOT: ${{ steps.cuda.outputs.CUDA_PATH }}
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake".Replace('\', '/')
          $triplets = "$env:GITHUB_WORKSPACE/vcpkg-triplets".Replace('\', '/')
          $python = (Get-Command python).Source.Replace('\', '/')
          $cuda = $env:CUDA_ROOT.Replace('\', '/')
          cmake -S . -B build-windows-cuda -G "Visual Studio 17 2022" `
            -A x64 -T "v143,cuda=$cuda" `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DCUDAToolkit_ROOT=$cuda" `
            "-DVCPKG_OVERLAY_TRIPLETS=$triplets" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-release `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON `
            -DVCPKG_MANIFEST_FEATURES=convert `
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>' `
            -DCMAKE_INSTALL_PREFIX=build-windows-cuda/stage `
            -DOVFTOOLKIT_BUILD_DOCS=OFF `
            -DOVFTOOLKIT_BUILD_WOLFRAM_BINDING=OFF `
            -DOVFTOOLKIT_BUILD_PYTHON_BINDING=ON `
            -DOVFTOOLKIT_BUILD_MUMAX_RUNNER=OFF `
            -DOVFTOOLKIT_USE_CUFFT=ON `
            -DOVFTOOLKIT_USE_FFTW=OFF `
            "-DPython_EXECUTABLE=$python"
      - name: Build Release
        run: cmake --build build-windows-cuda --config Release --parallel
      - name: Run complete test suite
        run: ctest --test-dir build-windows-cuda -C Release --output-on-failure
      - name: Stage tools
        run: cmake --install build-windows-cuda --config Release
      - name: Assemble portable CUDA package
        id: package
        shell: pwsh
        run: |
          $projectFile = Get-Content CMakeLists.txt -Raw
          if ($projectFile -notmatch 'project\(OVFToolkit VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not determine OVFToolkit version from CMakeLists.txt'
          }
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $name = "OVFToolkit-$($Matches[1])-$shortSha-windows-x64-cuda12.9-static-portable"
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "dist/$name"
          New-Item -ItemType Directory -Force $packageDir
          Copy-Item build-windows-cuda/stage/bin/*.exe $packageDir
          Copy-Item build-windows-cuda/stage/bin/*.dll $packageDir -ErrorAction SilentlyContinue
          Copy-Item "$env:CUDA_PATH/bin/cudart64_12.dll" $packageDir
          Copy-Item "$env:CUDA_PATH/bin/cufft64_11.dll" $packageDir
          Copy-Item LICENSE, LICENSING.md, THIRD_PARTY_NOTICES.md $packageDir
          $vcpkgLicenses = Join-Path $packageDir 'licenses/vcpkg'
          New-Item -ItemType Directory -Force $vcpkgLicenses
          Get-ChildItem build-windows-cuda/vcpkg_installed/x64-windows-static-release/share -Directory |
            ForEach-Object {
              $copyright = Join-Path $_.FullName 'copyright'
              if (Test-Path $copyright) {
                Copy-Item $copyright (Join-Path $vcpkgLicenses "$($_.Name).txt")
              }
            }
          $cudaEula = Get-ChildItem $env:CUDA_PATH -Filter EULA.txt -Recurse |
            Select-Object -First 1
          if ($cudaEula) {
            Copy-Item $cudaEula.FullName (Join-Path $packageDir 'NVIDIA-CUDA-EULA.txt')
          }
          & "$packageDir/ovf-convert.exe" --version
          & "$packageDir/ovf-batchfft.exe" --version
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist/$name.zip"
          Compress-Archive -Path $packageDir -DestinationPath $archive
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload portable CUDA tools
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
      - name: Select Python 3.12 for the stable ABI wheel
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install wheel build frontend
        run: python -m pip install build
      - name: Build CPython stable ABI wheel
        id: wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $prefix = "$env:GITHUB_WORKSPACE/build-windows-cuda/vcpkg_installed/x64-windows-static-release".Replace('\', '/')
          $env:CMAKE_ARGS = "-DCMAKE_PREFIX_PATH=$prefix"
          $env:CMAKE_BUILD_PARALLEL_LEVEL = '2'
          python -m build --wheel --outdir wheelhouse `
            --config-setting=wheel.py-api=cp312 `
            --config-setting=cmake.define.OVFTOOLKIT_PYTHON_STABLE_ABI=ON
          $wheel = Get-ChildItem wheelhouse/*.whl
          if ($wheel.Count -ne 1 -or $wheel.Name -notmatch '-cp312-abi3-win_amd64\.whl$') {
            throw "Expected one cp312-abi3 Windows wheel, found: $($wheel.Name -join ', ')"
          }
          $projectFile = Get-Content CMakeLists.txt -Raw
          if ($projectFile -notmatch 'project\(OVFToolkit VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not determine OVFToolkit version from CMakeLists.txt'
          }
          $version = $Matches[1]
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $name = "OVFToolkit-$version-$shortSha-windows-x64-cp312-abi3-wheel"
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "path=$($wheel.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Test stable ABI wheel with Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install and test stable ABI wheel
        shell: pwsh
        run: |
          python -m venv wheel-test
          $python = "$env:GITHUB_WORKSPACE/wheel-test/Scripts/python.exe"
          & $python -m pip install "${{ steps.wheel.outputs.path }}"
          & $python -c "import ovftoolkit as ovf; assert ovf.VField().data is None"
      - name: Upload stable ABI wheel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.wheel.outputs.name }}
          path: ${{ steps.wheel.outputs.path }}
          if-no-files-found: error

  # Disabled on pushes and pull requests for the initial rollout. It can be
  # exercised manually after the CUDA-only cache has completed successfully.
  windows-fftw-portable:
    name: Windows FFTW static portable
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_fftw_artifact }}
    runs-on: windows-2022
    env:
      VCPKG_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python build and test dependencies
        run: python -m pip install nanobind numpy
      - name: Identify vcpkg tool revision
        id: vcpkg
        shell: pwsh
        run: |
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse --short=12 HEAD
          "revision=$revision" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Restore release-only vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: windows-vcpkg-x64-static-release-fftw-v1-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**', 'vcpkg-overlays/fftw3/**') }}
          restore-keys: |
            windows-vcpkg-x64-static-release-cuda-v1-${{ steps.vcpkg.outputs.revision }}-
            windows-vcpkg-x64-static-release-fftw-v1-${{ steps.vcpkg.outputs.revision }}-
      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_BINARY_CACHE
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_BINARY_CACHE,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure FFTW-only static build
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake".Replace('\', '/')
          $triplets = "$env:GITHUB_WORKSPACE/vcpkg-triplets".Replace('\', '/')
          $python = (Get-Command python).Source.Replace('\', '/')
          cmake -S . -B build-windows-fftw -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_OVERLAY_TRIPLETS=$triplets" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_HOST_TRIPLET=x64-windows-release `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON `
            '-DVCPKG_MANIFEST_FEATURES=convert;fftw' `
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>' `
            -DCMAKE_INSTALL_PREFIX=build-windows-fftw/stage `
            -DOVFTOOLKIT_BUILD_DOCS=OFF `
            -DOVFTOOLKIT_BUILD_WOLFRAM_BINDING=OFF `
            -DOVFTOOLKIT_BUILD_PYTHON_BINDING=ON `
            -DOVFTOOLKIT_BUILD_MUMAX_RUNNER=OFF `
            -DOVFTOOLKIT_USE_CUFFT=OFF `
            -DOVFTOOLKIT_USE_FFTW=ON `
            "-DPython_EXECUTABLE=$python"
      - name: Build Release
        run: cmake --build build-windows-fftw --config Release --parallel
      - name: Run complete test suite
        run: ctest --test-dir build-windows-fftw -C Release --output-on-failure
      - name: Stage tools
        run: cmake --install build-windows-fftw --config Release
      - name: Assemble portable FFTW package
        id: package
        shell: pwsh
        run: |
          $projectFile = Get-Content CMakeLists.txt -Raw
          if ($projectFile -notmatch 'project\(OVFToolkit VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not determine OVFToolkit version from CMakeLists.txt'
          }
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $name = "OVFToolkit-$($Matches[1])-$shortSha-windows-x64-fftw3-static-portable"
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "dist/$name"
          New-Item -ItemType Directory -Force $packageDir
          Copy-Item build-windows-fftw/stage/bin/*.exe $packageDir
          Copy-Item build-windows-fftw/stage/bin/*.dll $packageDir -ErrorAction SilentlyContinue
          Copy-Item LICENSE, LICENSING.md, THIRD_PARTY_NOTICES.md $packageDir
          $vcpkgLicenses = Join-Path $packageDir 'licenses/vcpkg'
          New-Item -ItemType Directory -Force $vcpkgLicenses
          Get-ChildItem build-windows-fftw/vcpkg_installed/x64-windows-static-release/share -Directory |
            ForEach-Object {
              $copyright = Join-Path $_.FullName 'copyright'
              if (Test-Path $copyright) {
                Copy-Item $copyright (Join-Path $vcpkgLicenses "$($_.Name).txt")
              }
            }
          Copy-Item build-windows-fftw/vcpkg_installed/x64-windows-static-release/share/fftw3/copyright `
            $packageDir/FFTW-COPYING
          & "$packageDir/ovf-convert.exe" --version
          & "$packageDir/ovf-batchfft.exe" --version
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist/$name.zip"
          Compress-Archive -Path $packageDir -DestinationPath $archive
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload portable FFTW tools
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
