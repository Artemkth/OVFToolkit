[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovftoolkit-mumax-runner"
version = "0.2.1"
description = "Authenticated socket controller and interactive terminal for mumax3"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE*", "NOTICE"]
authors = [
    { name = "Artem Bondarenko" },
]
keywords = ["mumax3", "micromagnetics", "CUDA", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
mumax-runner = "ovftoolkit_mumax.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ovftoolkit_mumax = ["mumax-slave", "mumax-slave.exe"]
